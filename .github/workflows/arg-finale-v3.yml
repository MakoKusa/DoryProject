name: Apply ARG finale v3
on:
  push:
    branches: [main]
    paths: [scripts/apply_arg_finale_v3.py, .github/workflows/arg-finale-v3.yml]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: arg-finale-v3
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded patch
        run: python3 scripts/apply_arg_finale_v3.py
      - name: Commit generated changes
        run: |
          if git diff --quiet -- js/app.js index.html && [ -z "$(git ls-files --others --exclude-standard css/arg-finale.css)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js index.html css/arg-finale.css
          git commit -m "Fix ARG finale: green memory, simultaneous takeover, stable CREER and Nezuko"
          git push origin HEAD:main
      - name: Request Pages rebuild if configured
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" || echo "Check Pages deployment separately"
