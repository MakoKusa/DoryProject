name: Apply ARG v4 fixes
on:
  push:
    branches: [main]
    paths: [scripts/apply_arg_v4.py, scripts/run_arg_v4.py, .github/workflows/arg-v4.yml]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: arg-v4
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch and check syntax
        run: python3 scripts/run_arg_v4.py
      - name: Commit fixes
        run: |
          if git diff --quiet -- js/app.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Fix ARG: protected dates, CREER text flow and independent same-date memories"
          git push origin HEAD:main
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" || echo "Check Pages deployment separately"
