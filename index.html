  .cursor { animation: blink 1s steps(1) infinite; }
  footer { margin-top: auto; padding-top: 28px; }
  .bare h1, .bare footer { visibility: hidden; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes flick { 0%,100% { opacity: 1; } 91% { opacity: .95; } 93% { opacity: .82; } 95% { opacity: .98; } }
  @keyframes shake { 25% { transform: translate(-7px,3px); } 50% { transform: translate(6px,-4px); } 75% { transform: translate(-3px,-7px); } }

  #crt.shake { animation: shake .08s infinite; }
  #crt.crtoff { animation: crtoff .8s forwards; }
  #crt.inv { filter: invert(1); }
  @media (prefers-reduced-motion: reduce) { #crt, .cursor { animation: none; } }

    idle = Date.now();
    if (scr === "ss") { go("menu"); return; }
    if ((k === "m" || k === "M") && scr !== "pw") { muted = !muted; if (scr === "menu") draw(); return; }
    if (scr === "off") { beep(600, 80); boot(); return; }
    if (scr === "boot") { run++; go("menu"); return; }
    if (scr === "crash") { if (crashReady) boot(); return; }
    if (scr === "shut") return;
    if (scr === "jump") { if (jdone) go("menu"); return; }
    if (scr === "menu") {
      if (k === "ArrowDown") cur = (cur + 1) % IT.length;
      else if (k === "ArrowUp") cur = (cur + IT.length - 1) % IT.length;
      else if (k === "9") { beep(880, 80); go("game"); return; }
      else if (/^[0-8]$/.test(k)) cur = IT.findIndex(function (x) { return x[0].charAt(0) === k; });
      else if (k === "Enter") { beep(880, 80); var s = IT[cur][1]; if (s === "jump") jump(); else if (s === "shut") shut(); else go(s); return; }
      else return;
      beep(440, 40); draw(); return;
    }
    if (k === "Escape") { beep(330, 60); go("menu"); return; }
    if (scr === "nav") {
      if (k === "ArrowLeft") nf = (nf + 5) % 6;
      else if (k === "ArrowRight") nf = (nf + 1) % 6;
      else if (k === "ArrowUp") f[nf] = f[nf] + 1 > mx[nf] ? mn[nf] : f[nf] + 1;
      else if (k === "ArrowDown") f[nf] = f[nf] - 1 < mn[nf] ? mx[nf] : f[nf] - 1;
      else if (/^[0-9]$/.test(k)) { var v = (f[nf] * 10 + +k) % Math.pow(10, nf === 2 ? 4 : 2); f[nf] = v > mx[nf] ? +k : v; }
      else if (k === "r" || k === "R") { target = DEF; f = DEF.match(/\d+/g).map(Number); st = "DATE CIBLE REINITIALISEE"; beep(660, 100); }
      else if (k === "Enter") {
        var ok = f[2] >= 1000 && f[0] >= 1 && f[1] >= 1, dt = new Date(f[2], f[1] - 1, f[0]);
        if (ok && dt.getMonth() === f[1] - 1 && dt.getDate() === f[0]) {
          target = fv(0) + "/" + fv(1) + "/" + fv(2) + " - " + fv(3) + ":" + fv(4) + ":" + fv(5); st = "DATE CIBLE MISE A JOUR"; beep(1000, 120);
        } else { st = "DATE INVALIDE : LE CONTINUUM REFUSE"; beep(140, 250, "sawtooth"); }
      } else return;
      if (k !== "Enter" && k !== "r" && k !== "R") { st = ""; beep(440, 30); }
      draw(); return;
    }
    if (scr === "db") {
      if (k === "ArrowDown") dbi = (dbi + 1) % DB.length;
      else if (k === "ArrowUp") dbi = (dbi + DB.length - 1) % DB.length;
      else if (k === "Enter") { target = DB[dbi][0] + " - " + (DB[dbi][2] || "20:00:00"); st = "DATE CIBLE DEFINIE : " + target; beep(1000, 120); draw(); return; }
      else return;
      st = ""; beep(440, 40); draw(); return;
    }
    if (scr === "pw") {
      if (k === "Backspace") pwb = pwb.slice(0, -1);
      else if (k === "Enter") {
        if (pwb.toUpperCase() === "NEZUKO") { beep(1000, 120); crash(); return; }
        st = "ACCES REFUSE. MOT DE PASSE INCORRECT."; pwb = ""; beep(140, 300, "sawtooth");
      } else if (/^[a-zA-Z]$/.test(k) && pwb.length < 20) { pwb += k; st = ""; beep(500, 30); }
      else return;
      draw(); return;
    }
    if (scr === "game") {
      if (k === "ArrowLeft") gp = Math.max(0, gp - 3);
      else if (k === "ArrowRight") gp = Math.min(GW - 7, gp + 3);
      else if (k === "Enter" && gl <= 0) gameInit();
      else return;
      draw(); return;
    }
    if (scr === "para" && k === "Enter" && !prun) { beep(880, 80); para(); }
  });

  // ---------- Extras ----------
  var DOG = ["    /^-----^\\", "    V  o o  V", "     |  Y  |", "      \\ Q /", "      / - \\"].join("\n") + "\n";
  var BDAY_MSG = "Joyeux anniversaire Dory !";
  var NOTES = [262, 262, 294, 262, 349, 330, 262, 262, 294, 262, 392, 349];
  var idle = Date.now(), jdone = false, pwb = "";
  function al() { var v = metrics[4][1]; return v < 10 ? "!! SUSHIMETER CRITIQUE : A MANGER !!" : v > 90 ? "SUSHIMETER MAX : ENVIE DE SUSHIS" : ""; }
  function pwBox() {
    return box("ACCES RESTREINT", [{ t: "" }, { t: "COMMANDE INTERDITE. AUTHENTIFICATION REQUISE." }, { t: "" }, { t: "MOT DE PASSE : " + "*".repeat(pwb.length) + "_" }, { t: "" },
      { t: "indice : j'ai quatre pattes et je ressemble à un boudin de porte" }, { t: "" }, { t: "> " + (st || "ENTREE : VALIDER    ECHAP : RETOUR") }], W);
  }
  // Nezuko qui se promene
  var nz = 0, nd = 1, nph = 0, NPH = ["Promenade de Nezuko en cours", "Nezuko renifle un sushi", "Nezuko demande une barbe à papa", "Nezuko a trouvé un câble rose", "Nezuko surveille la machine"];
  function nezStep() { nz += nd; if (nz >= 32 || nz <= 0) { nd = -nd; nph = (nph + 1) % NPH.length; } }
  function nezBox() {
    var dog = nd > 0 ? "~^(o.o)^" : "^(o.o)^~";
    return box("NEZUKO.EXE", [{ t: "" }, { t: " ".repeat(nz) + dog }, { t: "" }, { t: "> " + NPH[nph] }], 42);
  }
  // Mini-jeu cache (touche 9 dans le menu)
  var GW = 40, GH = 14, gp = 16, gi = [], gs = 0, gl = 3;
  function gameInit() { gp = 16; gi = []; gs = 0; gl = 3; }
  function gameBox() {
    var L = [{ t: "SCORE : " + gs + "    VIES : " + "<3 ".repeat(Math.max(gl, 0)) }];
    for (var r = 0; r < GH; r++) {
      var row = " ".repeat(GW).split("");
      gi.forEach(function (o) { if (o.y === r) row[o.x] = o.c; });
      if (r === GH - 1) { var d = "^(o.o)^"; for (var i = 0; i < 7; i++) row[gp + i] = d.charAt(i); }
      L.push({ t: row.join("") });
    }
    L.push({ t: gl > 0 ? "FLECHES : BOUGER   S = SUSHI (+1)   X = OIGNON (-1 vie)" : "GAME OVER - ENTREE : REJOUER   ECHAP : RETOUR" });
    return box("SUSHI CATCHER - NEZUKO EDITION", L, 56);
  }
  setInterval(function () {
    if (scr !== "game" || gl <= 0) return;
    if (Math.random() < 0.35) gi.push({ x: Math.random() * GW | 0, y: 0, c: Math.random() < 0.3 ? "X" : "S" });
    gi.forEach(function (o) { o.y++; });
    gi = gi.filter(function (o) {
      if (o.y >= GH - 1) {
        if (o.x >= gp && o.x < gp + 7) { if (o.c === "S") { gs++; beep(900, 40); } else { gl--; beep(140, 200, "sawtooth"); } }
        return false;
      }
      return true;
    });
    draw();
  }, 220);
  // Ecran de veille
  var sx = 2, sy = 1, sdx = 1, sdy = 1, si = 0;
  var SSM = [["NEZUKO DEMANDE", "SA PROMENADE"], ["ENVIE DE SUSHIS", "DETECTEE"], ["BARBE A PAPA", "REQUISE (ROSE)"], ["HELLO KITTY", "VOUS SURVEILLE"], ["LES JUNIMOS", "SONT EN GREVE"]];
  setInterval(function () {
    if (scr === "menu" && Date.now() - idle > 45000) { scr = "ss"; setBare(); }
    if (scr !== "ss") return;
    sx += sdx * 2; sy += sdy; var b = false;
    if (sx <= 0 || sx >= 42) { sdx = -sdx; b = true; sx = Math.max(0, Math.min(42, sx)); }
    if (sy <= 0 || sy >= 14) { sdy = -sdy; b = true; sy = Math.max(0, Math.min(14, sy)); }
    if (b) { si = (si + 1) % SSM.length; beep(300, 40); }
    var lines = box("VEILLE", [{ t: "" }, { t: SSM[si][0] }, { t: SSM[si][1] }, { t: "" }], 28).split("\n").map(function (l) { return " ".repeat(sx) + l; });
    $("main").innerHTML = P("\n".repeat(sy) + lines.join("\n"));
  }, 300);
  // Saut temporel
  async function jump() {
    scr = "jump"; jdone = false; var tk = ++run; setBare();
    var d = target.slice(0, 10), dp = d.split("/"), dt = new Date(+dp[2], +dp[1] - 1, +dp[0]), now = new Date(); now.setHours(0, 0, 0, 0);
    if (!(await typeLines(["INITIALISATION DU SAUT TEMPOREL", "DESTINATION : " + target, "CHARGEMENT DU CONDENSATEUR DE FLUX ... OK", ""], 450, tk))) return;
    for (var i = 5; i >= 1; i--) {
      if (tk !== run) return;
      $("main").innerHTML = P("\n\n\n          SAUT DANS " + i + "...\n\n          [" + bar((6 - i) * 20, 20) + "]");
      crt.classList.add("shake"); beep(200 + (6 - i) * 120, 300); await sleep(900);
    }
    crt.classList.remove("shake");
    for (var j = 0; j < 10; j++) { if (tk !== run) return; crt.classList.toggle("inv", j % 2 === 0); beep(1500 - j * 100, 50, "sawtooth"); await sleep(70); }
    crt.classList.remove("inv");
    if (d === "19/09/2026") { await birthday(tk); jdone = tk === run; return; }
    var ev = DB.filter(function (x) { return x[0] === d; })[0];
    var L = [{ t: "" }, { t: "ARRIVEE : " + target }, { t: "SAUT REUSSI. STABILITE : " + (60 + Math.random() * 39 | 0) + "%" }, { t: "" }];
    wrap(ev ? "EVENEMENT DETECTE : " + ev[1] : dt > now ? "DESTINATION DANS LE FUTUR : aucun sushi n'y est encore prêt." : "AUCUN EVENEMENT CLE A CETTE DATE. Le continuum est calme. Nezuko dort.", W - 4)
      .forEach(function (x) { L.push({ t: x }); });
    L.push({ t: "" }, { t: "TOUCHE : RETOUR AU MENU" });
    $("main").innerHTML = P(box("ARRIVEE", L, W)); beep(1000, 200); jdone = true;
  }
  async function birthday(tk) {
    var rows = [], ch = "*+.o~'^";
    for (var i = 0; i < 72; i++) {
      if (tk !== run) return;
      var r = ""; for (var c = 0; c < W + 2; c++) r += Math.random() < 0.06 ? ch.charAt(Math.random() * ch.length | 0) : " ";
      rows.unshift(r); if (rows.length > 20) rows.pop();
      $("main").innerHTML = P(esc(rows.join("\n")));
      if (i % 6 === 0) beep(NOTES[i / 6], 180, "triangle");
      await sleep(90);
    }
    var L = [{ t: "" }, { t: "*** JOYEUX ANNIVERSAIRE DORY ! ***" }, { t: target.indexOf("23:19") > -1 ? "23:19 : L'HEURE EXACTE !" : "" }, { t: "" }];
    wrap(BDAY_MSG, W - 4).forEach(function (x) { L.push({ t: x }); });
    L.push({ t: "" }, { t: "TOUCHE : RETOUR AU MENU" });
    $("main").innerHTML = P(esc(rows.slice(0, 3).join("\n")) + "\n" + box("ANNIVERSAIRE DE DORY", L, W));
  }

  // ---------- Timers ----------
  function randomize() { metrics.forEach(function (m) { m[1] = Math.floor(Math.random() * 101); }); if (scr === "menu") { //if (metrics[4][1] < 10) beep(200, 200, "sawtooth");
    draw(); } }
  setInterval(randomize, 5000);
  setInterval(function () { if (scr === "menu") { nezStep(); draw(); } }, 1000);
  setInterval(function () { if (scr === "logs") { addLog(); draw(); } }, 900);
  draw();
})();
</script>
